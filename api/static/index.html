<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PMTiles Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f4f2ed;
        color: #1f2933;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(31, 41, 51, 0.14);
        box-shadow: 0 12px 28px rgba(31, 41, 51, 0.14);
      }

      select,
      button,
      a,
      .active-region {
        height: 34px;
        border: 1px solid rgba(31, 41, 51, 0.16);
        background: #fff;
        color: #1f2933;
        font: inherit;
      }

      select {
        min-width: 132px;
        padding: 0 30px 0 10px;
      }

      button,
      a,
      .active-region {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        text-decoration: none;
      }

      button,
      a {
        cursor: pointer;
      }

      .active-region {
        min-width: 128px;
        max-width: min(320px, 42vw);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        position: absolute;
        right: 12px;
        bottom: 24px;
        z-index: 2;
        max-width: min(360px, calc(100vw - 24px));
        padding: 8px 10px;
        background: rgba(31, 41, 51, 0.86);
        color: #fff;
        font-size: 12px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="toolbar">
      <span id="active-region" class="active-region">Auto</span>
      <select id="style" aria-label="Style"></select>
      <button id="reload" type="button">Reload</button>
      <a id="manifest" href="/api/manifest.json" target="_blank" rel="noreferrer">Manifest</a>
    </div>
    <div id="status" class="status">Loading</div>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.1/dist/pmtiles.js"></script>
    <script>
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);
      maplibregl.setRTLTextPlugin(
        "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js",
        true
      );

      const activeRegionEl = document.querySelector("#active-region");
      const styleSelect = document.querySelector("#style");
      const reloadButton = document.querySelector("#reload");
      const manifestLink = document.querySelector("#manifest");
      const statusEl = document.querySelector("#status");
      const API_BASE = location.protocol === "file:" ? "http://localhost:8090" : "";
      let map;
      let activeStyleKey = "";
      let autoLoadTimer;
      let styleRequestId = 0;

      function apiUrl(path) {
        return `${API_BASE}${path}`;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      async function loadStyles() {
        const response = await fetch(apiUrl("/api/styles"));
        const payload = await response.json();
        styleSelect.innerHTML = "";
        for (const style of payload.styles) {
          const option = document.createElement("option");
          option.value = style.id;
          option.textContent = style.name || style.id;
          styleSelect.append(option);
        }
        styleSelect.value = new URLSearchParams(location.search).get("style") || payload.default_style || "light";
      }

      function formatCoord(value) {
        return Number(value).toFixed(6);
      }

      function appendCurrentViewport(params) {
        if (!map) {
          const initialParams = new URLSearchParams(location.search);
          for (const key of ["lon", "lat", "bbox", "zoom"]) {
            if (initialParams.has(key)) {
              params.set(key, initialParams.get(key));
            }
          }
          return;
        }

        const center = map.getCenter();
        const bounds = map.getBounds();
        const zoom = map.getZoom();
        params.set("lon", formatCoord(center.lng));
        params.set("lat", formatCoord(center.lat));
        params.set("zoom", zoom.toFixed(2));

        if (zoom >= 5.5) {
          params.set(
            "bbox",
            [
              bounds.getWest(),
              bounds.getSouth(),
              bounds.getEast(),
              bounds.getNorth()
            ].map(formatCoord).join(",")
          );
        }
      }

      function stylePath() {
        const styleId = styleSelect.value || "light";
        const params = new URLSearchParams({ style: styleId });
        appendCurrentViewport(params);
        return `/api/style.json?${params.toString()}`;
      }

      function updateManifestLink(regions) {
        if (regions.length === 1) {
          manifestLink.href = apiUrl(`/api/manifest/${regions[0]}.json`);
          return;
        }

        const params = new URLSearchParams();
        appendCurrentViewport(params);
        manifestLink.href = apiUrl(`/api/resolve?${params.toString()}`);
      }

      function updateStatus(style) {
        const styleId = styleSelect.value || "light";
        const regions = style.metadata?.regions || [style.metadata?.region].filter(Boolean);
        const regionText = regions.length ? regions.join(", ") : "no region";
        const tilesets = Object.keys(style.metadata?.tilesets || {}).join(", ");
        activeRegionEl.textContent = `Auto: ${regionText}`;
        updateManifestLink(regions);
        setStatus(`${regionText} / ${styleId}: ${tilesets || "no tilesets"}`);
      }

      function scheduleAutoLoad() {
        window.clearTimeout(autoLoadTimer);
        autoLoadTimer = window.setTimeout(() => {
          loadMap().catch((error) => setStatus(error.message));
        }, 350);
      }

      async function loadMap({ force = false } = {}) {
        const styleUrl = stylePath();
        const requestId = ++styleRequestId;
        setStatus("Loading map data");
        const response = await fetch(apiUrl(styleUrl), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(await response.text());
        }

        const style = await response.json();
        if (requestId !== styleRequestId) {
          return;
        }

        const styleKey = style.metadata?.style_key || styleUrl;
        if (!force && map && styleKey === activeStyleKey) {
          updateStatus(style);
          return;
        }
        activeStyleKey = styleKey;

        const isInitialLoad = !map;
        if (isInitialLoad) {
          map = new maplibregl.Map({
            container: "map",
            style,
            center: style.center || [45, 24],
            zoom: style.zoom || 7,
            pitch: style.pitch || 0,
            bearing: style.bearing || 0,
            hash: true
          });
          map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
          map.on("moveend", scheduleAutoLoad);
        } else {
          map.setStyle(style);
          if (force) {
            map.easeTo({
              pitch: style.pitch || 0,
              bearing: style.bearing || 0,
              duration: 450
            });
          }
        }

        if (isInitialLoad && style.metadata?.bounds && !location.hash) {
          map.fitBounds(style.metadata.bounds, { padding: 48, duration: 0, maxZoom: 11 });
        }

        map.once("idle", () => {
          updateStatus(style);
        });
      }

      reloadButton.addEventListener("click", () => loadMap({ force: true }).catch((error) => setStatus(error.message)));
      styleSelect.addEventListener("change", () => loadMap({ force: true }).catch((error) => setStatus(error.message)));

      loadStyles()
        .then(loadMap)
        .catch((error) => setStatus(error.message));
    </script>
  </body>
</html>
