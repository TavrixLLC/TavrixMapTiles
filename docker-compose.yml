services:
  pmtiles-builder:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "scripts/build.py", "--help"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "scripts/build.py", "--scheduler"]
    profiles: ["scheduler"]
    restart: unless-stopped

  map-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8090}
      APP_ENV: ${APP_ENV:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-*}
      MAP_INTERNAL_TOKEN: ${MAP_INTERNAL_TOKEN:-dev-internal-token}
      TRUSTED_GATEWAY_HEADER: ${TRUSTED_GATEWAY_HEADER:-}
      TRUSTED_GATEWAY_HEADER_VALUE: ${TRUSTED_GATEWAY_HEADER_VALUE:-}
      PUBLIC_DIRECT_TILE_ENDPOINTS: ${PUBLIC_DIRECT_TILE_ENDPOINTS:-}
      ALLOW_PUBLIC_DIRECT_TILES_IN_PRODUCTION: ${ALLOW_PUBLIC_DIRECT_TILES_IN_PRODUCTION:-false}
      REQUIRE_REVERSE_PROXY: ${REQUIRE_REVERSE_PROXY:-false}
      TRUSTED_PROXY_MODE: ${TRUSTED_PROXY_MODE:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      TILES_BEHIND_GATEWAY: ${TILES_BEHIND_GATEWAY:-false}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      STATIC_BASE_URL: ${STATIC_BASE_URL:-}
      STATIC_PUBLISH_ROOT: ${STATIC_PUBLISH_ROOT:-}
      STYLE_VALIDATE_MAX_BODY_BYTES: ${STYLE_VALIDATE_MAX_BODY_BYTES:-1048576}
      REGION: ${REGION:-saudi}
      MAP_STYLE: ${MAP_STYLE:-light}
      GLYPHS_URL: ${GLYPHS_URL:-}
      LOCAL_GLYPHS_URL: ${LOCAL_GLYPHS_URL:-/api/fonts/{fontstack}/{range}.pbf}
      GLYPH_FONTSTACKS: ${GLYPH_FONTSTACKS:-Noto Sans Regular}
      GLYPH_READINESS_TIMEOUT_SECONDS: ${GLYPH_READINESS_TIMEOUT_SECONDS:-3}
      GLYPHS_DIR: /app/config/glyphs
      SPRITES_DIR: /app/config/sprites
      SPRITES_BASE_URL: ${SPRITES_BASE_URL:-}
      CONFIG_DIR: /app/config
      STYLES_DIR: /app/config/styles
      OUTPUT_DIR: /app/output
    volumes:
      - ./api:/app/api:ro
      - ./config:/app/config:ro
      - ./output:/app/output:ro
    ports:
      - "8090:8090"
    command: ["python3", "api/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; port=os.getenv('API_PORT','8090'); response=urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health/ready', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles: ["local-object-storage"]

  static:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./config/nginx-pmtiles.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["static"]

volumes:
  minio-data:
