services:
  pmtiles-builder:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "scripts/build.py", "--help"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "scripts/build.py", "--scheduler"]
    profiles: ["scheduler"]
    restart: unless-stopped

  map-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8090}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-*}
      MAP_INTERNAL_TOKEN: ${MAP_INTERNAL_TOKEN:-dev-internal-token}
      REGION: ${REGION:-saudi}
      MAP_STYLE: ${MAP_STYLE:-light}
      GLYPHS_URL: ${GLYPHS_URL:-/api/fonts/{fontstack}/{range}.pbf}
      LOCAL_GLYPHS_URL: ${LOCAL_GLYPHS_URL:-/api/fonts/{fontstack}/{range}.pbf}
      GLYPHS_DIR: /app/config/glyphs
      SPRITES_DIR: /app/config/sprites
      CONFIG_DIR: /app/config
      STYLES_DIR: /app/config/styles
      OUTPUT_DIR: /app/output
    volumes:
      - ./api:/app/api:ro
      - ./config:/app/config:ro
      - ./output:/app/output:ro
    ports:
      - "8090:8090"
    command: ["python3", "api/server.py"]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles: ["local-object-storage"]

  static:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./config/nginx-pmtiles.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["static"]

volumes:
  minio-data:
