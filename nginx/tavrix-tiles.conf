# TavrixMap Tiles static production server.
# Include this file from nginx http{} context, for example /etc/nginx/conf.d/tavrix-tiles.conf.

log_format tavrix_tiles escape=json
  '{"ts":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"args":"$args",'
  '"status":$status,'
  '"bytes_sent":$bytes_sent,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"http_range":"$http_range",'
  '"request_time":$request_time,'
  '"referer":"$http_referer",'
  '"origin":"$http_origin",'
  '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name tiles.tavrix.com;
    root /var/www/tavrix-tiles;

    sendfile on;
    tcp_nopush on;
    gzip off;

    access_log /var/log/nginx/tavrix-tiles.access.log tavrix_tiles;
    error_log /var/log/nginx/tavrix-tiles.error.log warn;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Cache-Control" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    types {
        application/json json;
        application/vnd.pmtiles pmtiles;
        application/x-protobuf pbf;
        image/png png;
        image/webp webp;
    }

    location /tiles/ {
        gzip off;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /manifests/ {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /sprites/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
